<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running checks · SciVerify</title>
    <link rel="icon" type="image/png" href="../../../assets/img/scicrypt-mark.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../../../assets/css/chrome.css" rel="stylesheet">
<script>
    // Apply saved theme synchronously to prevent flash of dark content.
(function () {
    try {
        if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.add("theme-light");
            // The body element isn't parsed yet (this script runs in <head>).
            // Use a MutationObserver to add the class to <body> the instant
            // it's appended, before any body content is painted.
            new MutationObserver(function (_, obs) {
                if (document.body) {
                    document.body.classList.add("theme-light");
                    obs.disconnect();
                }
            }).observe(document.documentElement, { childList: true, subtree: true });
        }
    } catch (e) {}
})();
</script>
</head>
<body class="theme-glass" data-app="sciverify" data-active="check">
<nav id="chrome-sidebar"></nav>
<main class="main-content">
    <div id="chrome-topbar"></div>

    <div class="container fade-in" style="max-width: 640px;">
        <div class="card shadow-sm">
            <div class="card-body text-center py-5">
                <div class="spinner-border text-info mb-3" role="status" style="width:3rem;height:3rem;"></div>
                <h5 class="mb-1" id="phase-title">Preparing checks…</h5>
                <p class="text-muted mb-4" style="font-size:0.85rem;" id="phase-note">Uploading the manuscript and provisioning the hidden dataflow.</p>
                <div class="progress mx-auto" style="max-width:420px;height:10px;">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width:0%;"></div>
                </div>
                <div class="d-flex justify-content-between mt-2 mx-auto" style="max-width:420px;font-size:0.72rem;color:rgba(255,255,255,0.45);">
                    <span>References</span><span>AI detection</span><span>Data checks</span>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../assets/js/theme.js"></script>
<script src="../../../assets/js/chrome.js"></script>
<script src="../../../assets/js/demo-data.js"></script>
<script src="../../../assets/js/demo-router.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var phases = [
    { t: "Validating references…", n: "Resolving every DOI against Crossref.", p: 25 },
    { t: "Detecting AI-written text…", n: "Running the perplexity model and heuristics across each section.", p: 60 },
    { t: "Verifying the data…", n: "Scoring completeness, traceability, reproducibility, and manipulation transparency.", p: 85 },
    { t: "Assembling the report…", n: "Grouping flagged passages by section.", p: 100 },
  ];
  var bar = document.getElementById("progress-bar");
  var title = document.getElementById("phase-title");
  var note = document.getElementById("phase-note");
  var i = 0;
  function step() {
    if (i < phases.length) {
      title.textContent = phases[i].t;
      note.textContent = phases[i].n;
      bar.style.width = phases[i].p + "%";
      i++;
      setTimeout(step, 900);
    } else {
      setTimeout(function () { window.location.href = "result.html"; }, 450);
    }
  }
  step();
});
</script>
</body>
</html>
